# Runs MongoDB locally with data persisted to ./data/mongo
# Usage: docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: discipline-os-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"  # local only; this MongoDB has no password
    volumes:
      - ./data/mongo:/data/db
